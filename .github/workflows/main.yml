name: Build Web Game to Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip project
      run: unzip -o "*.zip" -d project_files

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install Bun
      uses: oven-sh/setup-bun@v1

    - name: Install dependencies & Build Web
      working-directory: ./project_files
      run: |
        bun install
        bun run build

    - name: Add Capacitor Android Platform
      working-directory: ./project_files
      run: |
        bun add @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "Tactical BattleGrounds" "com.tactical.battlegrounds" --web-dir dist
        npx cap add android
        npx cap copy android

    - name: Build APK with Gradle
      working-directory: ./project_files/android
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Tactical-BattleGrounds-APK
        path: project_files/android/app/build/outputs/apk/debug/app-debug.apk
